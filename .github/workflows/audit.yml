# Once a month, whenever the pinned versions change, and on demand (Actions -> audit -> Run workflow) checks the libraries the app runs on against the
# public vulnerability databases with pip-audit. A known hole in one of them makes this job fail, and GitHub then
# e-mails the owner. Runs on Python 3.12 like the Vercel build (the tests job uses 3.9, which resolves older libraries). Only the runtime libraries (requirements.txt) are audited; the test tools never reach production.
name: audit
on:
  schedule:
    - cron: "0 3 5 * *"
  push:
    paths: ["requirements.txt", "pyproject.toml"]   # changing a pin re-checks it straight away, not a month later
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pip-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the same Python Vercel builds with, so the audit sees the versions production gets
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
