# Opens the real page in Chromium against a throw-away copy of the API and checks what a visitor sees and does
# (sorting, compare chart, shelter box, low-battery mode, saved data while offline...). See e2e/conftest.py.
# The map libraries come from cdnjs, so this needs internet (GitHub's runners have it).
name: e2e
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest playwright
      - run: playwright install --with-deps chromium
      - run: python -m pytest e2e -q
        env:
          E2E: "1"
