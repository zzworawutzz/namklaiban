# Free-plan scheduler: Vercel Hobby only allows one cron run per day, so GitHub calls the
# protected endpoint every 20 minutes instead. (On Vercel Pro use `crons` in vercel.json.)
# Needs repo secret CRON_SECRET (same value as the Vercel env var) and repo variable APP_URL
# (e.g. https://your-app.vercel.app, no trailing slash).
# GitHub may delay scheduled runs by several minutes and disables them after 60 days
# without repo activity.
name: ingest
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
concurrency: ingest
permissions:
  contents: read        # the job only calls our own endpoint with curl; it needs nothing from GitHub
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/ingest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl --fail-with-body -sS --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL}/api/cron/ingest"
