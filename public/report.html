<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รายงานสถานการณ์น้ำ</title>
<meta name="theme-color" content="#0e5a78">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf2f5;--surface:#fff;--ink:#10252f;--muted:#587280;--line:#d3dfe5;--accent:#0e5a78;--accent-ink:#fff;
--normal:#1b8f61;--watch:#c98a00;--alert:#d2372f;--unknown:#6b7f8a;
--normal-bg:rgba(27,143,97,.14);--watch-bg:rgba(201,138,0,.16);--alert-bg:rgba(210,55,47,.14);--unknown-bg:rgba(107,127,138,.16)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1920;--surface:#12262f;--ink:#e5f0f4;--muted:#8fa9b5;--line:#24404c;--accent:#5bb8dc;--accent-ink:#06222d;--normal:#3dc08a;--watch:#e8b43a;--alert:#ff6b61;--unknown:#98adb7}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:15px;line-height:1.5}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
header a{color:var(--accent);font-weight:600;text-decoration:none}
h1{margin:0;font-size:20px}
main{max-width:860px;margin:0 auto;padding:16px}
select{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);min-width:220px}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}
h2{font-size:16px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.kpi b{display:block;font-size:30px;line-height:1.1}
.kpi small{color:var(--muted)}
.kpi.alert{background:var(--alert-bg)}.kpi.watch{background:var(--watch-bg)}.kpi.normal{background:var(--normal-bg)}.kpi.unknown{background:var(--unknown-bg)}
.up{color:var(--alert);font-weight:600}.down{color:var(--normal);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 4px;border-top:1px solid var(--line)}
th{color:var(--muted);font-weight:500;border-top:0}
td.n,th.n{text-align:right;white-space:nowrap}
.badge{display:inline-flex;padding:1px 9px;border-radius:999px;font-weight:600;font-size:12px;white-space:nowrap}
.badge.normal{background:var(--normal-bg);color:var(--normal)}.badge.watch{background:var(--watch-bg);color:var(--watch)}.badge.alert{background:var(--alert-bg);color:var(--alert)}.badge.unknown{background:var(--unknown-bg);color:var(--unknown)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:12px;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:8px;padding:10px 12px;font:inherit;font-size:14px;margin:0 0 10px}
.err{background:var(--alert-bg);border:1px solid var(--alert);border-radius:8px;padding:8px 10px}
.foot{color:var(--muted);font-size:12px;margin:18px 0 8px}
@media print{header select,header .btn,#copy{display:none}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <h1>รายงานสถานการณ์น้ำ</h1>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <select id="prov" aria-label="เลือกจังหวัด"></select>
    <a href="./" id="back">← แผนที่</a>
  </div>
</header>
<main>
  <div id="err" class="err" hidden></div>
  <div id="out" aria-live="polite"><p class="sub">กำลังโหลด…</p></div>
  <p class="foot">ข้อมูลจาก ThaiWater (สสน.) ใช้ประกอบการตัดสินใจเท่านั้น ไม่ใช่ประกาศทางการ ให้ยึดคำสั่งของ ปภ. ในพื้นที่เป็นหลัก (สายด่วน 1784)</p>
</main>
<script>
(function(){
"use strict";
var QS = new URLSearchParams(location.search);
var API = (QS.get("api") || (location.protocol==="file:" ? "http://127.0.0.1:8000" : location.origin)).replace(/\/$/,"");
var DEFAULT_PROVINCE = "พระนครศรีอยุธยา";
var LABEL = {normal:"ปกติ", watch:"เฝ้าระวัง", alert:"เตือนภัย", unknown:"ไม่มีเกณฑ์"};
var COLOR = {alert:"var(--alert)", watch:"var(--watch)", normal:"var(--normal)"};
var TREND = {rising:"▲", falling:"▼", steady:"■"};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){} return null;}
function getJSON(path){ return fetch(API+path).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }); }
function pct(x){ return x==null ? "-" : Math.round(x)+"%"; }
function sign(n){ return n>0 ? "+"+n : String(n); }
function dayLabel(d){ var p=d.split("-"); return +p[2]+"/"+(+p[1]); }

function delta(n, label){
  if(n==null) return "";
  var cls = n>0 ? "up" : n<0 ? "down" : "";
  return '<small class="'+cls+'">'+sign(n)+' จากเมื่อวาน</small>';
}
function kpi(cls, n, label, d){
  return '<div class="kpi '+cls+'"><small>'+label+'</small><b>'+n+'</b>'+(d==null?"":delta(d))+'</div>';
}

function chart(series){
  var W=720, H=210, pl=30, pr=8, pt=10, pb=26, n=series.length;
  var max = Math.max(1, Math.max.apply(null, series.map(function(s){return s.alert+s.watch+s.normal;})));
  var bw = (W-pl-pr)/n, gap = Math.min(6, bw*0.25);
  function Y(v){ return pt + (1 - v/max) * (H-pt-pb); }
  var s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="จำนวนสถานีแยกตามสถานะในแต่ละวัน">';
  [0, Math.round(max/2), max].forEach(function(v){
    s += '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(pl-4)+'" y="'+(Y(v)+4)+'" font-size="10" fill="var(--muted)" text-anchor="end">'+v+'</text>';
  });
  series.forEach(function(d,i){
    var x = pl + i*bw + gap/2, w = bw-gap, base = 0;
    ["alert","watch","normal"].forEach(function(k){
      var v = d[k]; if(!v) return;
      var y1 = Y(base+v), y0 = Y(base); base += v;
      s += '<rect x="'+x.toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+(y0-y1).toFixed(1)+'" fill="'+COLOR[k]+'"><title>'+dayLabel(d.day)+' '+LABEL[k]+' '+v+' สถานี</title></rect>';
    });
    if(i%Math.ceil(n/7)===0 || i===n-1) s += '<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-8)+'" font-size="10" fill="var(--muted)" text-anchor="middle">'+dayLabel(d.day)+'</text>';
  });
  return s + '</svg>';
}

function stationRows(list, withRate){
  if(!list.length) return '<p class="sub">ไม่มี</p>';
  return '<table><thead><tr><th>สถานี</th><th class="n">% ตลิ่ง</th><th class="n">'+(withRate?'อัตรา/ชม.':'แนวโน้ม')+'</th><th>สถานะ</th></tr></thead><tbody>'+
    list.map(function(r){
      var t = withRate && r.trend_pct_per_hr!=null ? sign(r.trend_pct_per_hr.toFixed(1))+"%" : (TREND[r.trend]||"");
      return '<tr><td>'+esc(r.name)+(r.stale?' <small class="sub">· ข้อมูลไม่อัปเดต</small>':'')+(r.twin_conflict?' <small class="sub">· ⚠ สองแหล่งขัดกัน</small>':'')+'</td><td class="n">'+pct(r.pct_of_bank)+'</td><td class="n">'+t+'</td><td><span class="badge '+r.status+'">'+LABEL[r.status]+'</span></td></tr>';
    }).join("")+'</tbody></table>';
}

function render(rep){
  var c = rep.counts, d = rep.delta_24h;
  var h = '<div class="card"><p class="sub" style="margin-bottom:2px">จังหวัด</p><h2 style="font-size:22px;margin:0">'+esc(rep.province)+'</h2>'+
    '<p class="sub">'+rep.stations+' สถานี · อัปเดต '+new Date(rep.generated_at).toLocaleString("th-TH",{timeZone:"Asia/Bangkok",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+' น.'+(rep.stale?' · ข้อมูลค้าง '+rep.stale+' สถานี':'')+'</p></div>';
  h += '<div class="card"><div class="kpis">'+kpi("alert",c.alert,"เตือนภัย",d&&d.alert)+kpi("watch",c.watch,"เฝ้าระวัง",d&&d.watch)+kpi("normal",c.normal,"ปกติ")+(c.unknown?kpi("unknown",c.unknown,"ไม่มีเกณฑ์"):"")+'</div>';
  if(rep.over_bank) h += '<p style="margin:10px 0 0"><b class="up">ล้นตลิ่งแล้ว '+rep.over_bank+' สถานี</b>'+(rep.newly_over_bank.length?' · ล้นใหม่ใน 24 ชม.: '+rep.newly_over_bank.map(function(r){return esc(r.name);}).join(", "):'')+'</p>';
  if(!d) h += '<p class="sub" style="margin-top:8px">ยังเทียบกับเมื่อวานไม่ได้ (ระบบยังสะสมข้อมูลย้อนหลังไม่ครบ)</p>';
  h += '</div>';
  h += '<div class="card"><h2>จำนวนสถานีตามสถานะ แยกรายวัน</h2><p class="sub">นับตามค่าสูงสุดของแต่ละสถานีในวันนั้น (เวลาไทย) วันนี้ยังนับไม่ครบวัน</p>'+chart(rep.series)+
    '<div class="legend"><span><i style="background:var(--alert)"></i>เตือนภัย</span><span><i style="background:var(--watch)"></i>เฝ้าระวัง</span><span><i style="background:var(--normal)"></i>ปกติ</span></div></div>';
  h += '<div class="card"><h2>น้ำสูงสุด '+rep.top.length+' อันดับ</h2>'+stationRows(rep.top,false)+'</div>';
  if(rep.rising.length) h += '<div class="card"><h2>กำลังสูงขึ้นเร็ว</h2>'+stationRows(rep.rising,true)+'</div>';
  h += '<div class="card"><h2>ข้อความสำหรับแชร์</h2><pre id="txt">'+esc(rep.text)+'</pre><button class="btn primary" id="copy" type="button">คัดลอกข้อความ</button> <button class="btn" type="button" onclick="window.print()">พิมพ์</button> <span class="sub" id="copyMsg" aria-live="polite"></span></div>';
  $("out").innerHTML = h;
  $("copy").addEventListener("click",function(){
    var t = rep.text + "\n" + location.href.split("&api=")[0];
    var done = function(m){ $("copyMsg").textContent = m; };
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){done("คัดลอกแล้ว");},function(){done("คัดลอกไม่ได้ ลองเลือกข้อความเอง");});
    else done("เบราว์เซอร์ไม่รองรับการคัดลอก");
  });
  document.title = "รายงานสถานการณ์น้ำ จ."+rep.province;
}

function show(province){
  $("err").hidden = true; $("out").innerHTML = '<p class="sub">กำลังโหลด…</p>';
  getJSON("/reports/"+encodeURIComponent(province)).then(render).catch(function(e){
    $("out").innerHTML = ""; $("err").hidden = false;
    $("err").textContent = e.message==="HTTP 404" ? "ไม่พบจังหวัด "+province : "โหลดรายงานไม่ได้ ("+e.message+") ลองใหม่อีกครั้ง";
  });
}

getJSON("/stations").then(function(list){
  var names = {}; list.forEach(function(s){ if(s.province) names[s.province] = (names[s.province]||0)+1; });
  var keys = Object.keys(names).sort(function(a,b){return a.localeCompare(b,"th");});
  var saved = store("nkb-prov");
  var want = QS.get("province") || (saved && saved!=="all" ? saved : DEFAULT_PROVINCE);
  if(!names[want]) want = keys[0];
  $("prov").innerHTML = keys.map(function(n){ return '<option value="'+esc(n)+'">'+esc(n)+' ('+names[n]+')</option>'; }).join("");
  $("prov").value = want;
  $("prov").addEventListener("change",function(e){
    var u = new URL(location.href); u.searchParams.set("province", e.target.value); history.replaceState(null,"",u);
    store("nkb-prov", e.target.value);
    show(e.target.value);
  });
  show(want);
}).catch(function(e){ $("out").innerHTML = ""; $("err").hidden = false; $("err").textContent = "เชื่อมต่อ API ไม่ได้ ("+e.message+")"; });
})();
</script>
</body>
</html>
